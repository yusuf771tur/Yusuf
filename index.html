<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud App — Личный мессенджер</title>
<style>
body {
  font-family: 'Inter', sans-serif;
  background: #f0f2f5;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 20px;
  margin: 0;
}
.container {
  width: 100%;
  max-width: 500px;
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.05);
  margin-bottom: 20px;
  box-sizing: border-box;
}
.auth-card { text-align: center; }
#loginBtn {
  background: white;
  color: #444;
  border: 1px solid #dadce0;
  padding: 12px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-weight: 600;
  font-size: 16px;
}
.user-info {
  display: none;
  align-items: center;
  justify-content: space-between;
  width: 100%;
}
.user-profile {
  display: flex;
  align-items: center;
  gap: 12px;
}
.user-avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 2px solid #007bff;
}
input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 14px;
}
#mainBtn {
  background: #007bff;
  color: white;
  border: none;
  padding: 14px;
  border-radius: 8px;
  width: 100%;
  font-weight: 600;
  cursor: pointer;
}
.post {
  background: white;
  border: 1px solid #f0f0f0;
  padding: 20px;
  margin-top: 15px;
  border-radius: 12px;
  position: relative;
}
.post img {
  width: 100%;
  border-radius: 8px;
  margin-top: 10px;
  max-height: 400px;
  object-fit: cover;
}
.time {
  font-size: 12px;
  color: #9ca3af;
  position: absolute;
  top: 20px;
  right: 20px;
}
.actions {
  display: flex;
  gap: 8px;
  margin-top: 15px;
}
button.react-btn {
  cursor: pointer;
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid #eee;
  background: white;
}
.del-btn {
  margin-left: auto;
  background: none;
  border: none;
  color: red;
  cursor: pointer;
}
#chatMessages {
  height: 250px;
  overflow-y: auto;
  border: 1px solid #eee;
  padding: 10px;
  border-radius: 8px;
  margin-bottom: 10px;
}
#sendChatBtn {
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #007bff, #00c6ff);
  color: white;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
#sendChatBtn:hover {
  transform: scale(1.02);
  opacity: 0.9;
}
#chatInput {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  margin-bottom: 10px;
  border-radius: 10px;
  border: 1px solid #ddd;
}
</style>
</head>
<body>

<div class="container auth-card">
  <button id="loginBtn">Войти через Google</button>
</div>

<div id="userInfo" class="container user-info">
  <div class="user-profile">
    <img id="userPhoto" class="user-avatar">
    <span id="userName"></span>
  </div>
  <button id="logoutBtn">Выйти</button>
</div>

<div id="messageForm" class="container" style="display:none;">
  <h3>Создать пост</h3>
  <input type="text" id="nameInput" readonly>
  <input type="text" id="contentInput" placeholder="Текст...">
  <input type="text" id="imageUrlInput" placeholder="Ссылка на картинку">
  <button id="mainBtn">Опубликовать</button>
</div>

<div id="chatBox" class="container" style="display:none;">
  <h3>Личный чат</h3>
  <select id="chatUserSelect">
    <option value="">Выберите собеседника</option>
  </select>
  <div id="chatMessages"></div>
  <input type="text" id="chatInput" placeholder="Сообщение...">
  <button id="sendChatBtn">Отправить</button>
</div>

<div id="feed" style="max-width:500px;width:100%;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDZcurSOkEfsL4gqdGAgVE9Kcxuw9YN2xs",
  authDomain: "yusuf-5c586.firebaseapp.com",
  projectId: "yusuf-5c586",
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let allUsers = [];

// ===== LOGIN =====
document.getElementById("loginBtn").onclick = async () => {
  const result = await signInWithPopup(auth, provider);
  currentUser = result.user;
  showUserInfo();
  loadAllUsers();
};

document.getElementById("logoutBtn").onclick = async () => {
  await signOut(auth);
  location.reload();
};

function showUserInfo() {
  document.getElementById("userInfo").style.display = "flex";
  document.getElementById("messageForm").style.display = "block";
  document.getElementById("chatBox").style.display = "block";
  document.getElementById("userPhoto").src = currentUser.photoURL;
  document.getElementById("userName").innerText = currentUser.displayName;
  document.getElementById("nameInput").value = currentUser.displayName;
}

// ===== USERS (для выбора собеседника) =====
async function loadAllUsers() {
  const usersSnap = await onSnapshot(collection(db, "users"), (snap) => {
    allUsers = [];
    const select = document.getElementById("chatUserSelect");
    select.innerHTML = '<option value="">Выберите собеседника</option>';
    snap.forEach(d => {
      const u = d.data();
      if (u.uid !== currentUser.uid) {
        allUsers.push(u);
        const opt = document.createElement("option");
        opt.value = u.uid;
        opt.textContent = u.name;
        select.appendChild(opt);
      }
    });
  });
}

// ===== POSTS =====
document.getElementById("mainBtn").onclick = async () => {
  await addDoc(collection(db, "requests"), {
    name: currentUser.displayName,
    text: document.getElementById("contentInput").value,
    imageUrl: document.getElementById("imageUrlInput").value,
    reactions: { like: 0, fire: 0, laugh: 0 },
    timestamp: serverTimestamp()
  });
  document.getElementById("contentInput").value = "";
  document.getElementById("imageUrlInput").value = "";
};

// ===== FEED =====
const feedQuery = query(collection(db, "requests"), orderBy("timestamp", "desc"));
onSnapshot(feedQuery, snap => {
  const feed = document.getElementById("feed");
  feed.innerHTML = "";
  snap.forEach(d => {
    const data = d.data();
    const id = d.id;
    feed.innerHTML += `
    <div class="post">
      <span class="time">${data.timestamp?.toDate().toLocaleString() || ""}</span>
      <b>${data.name}</b>
      <p>${data.text || ""}</p>
      ${data.imageUrl ? `<img src="${data.imageUrl}">` : ""}
      <div class="actions">
        <button class="react-btn" onclick="react('${id}','like')">👍 ${data.reactions?.like || 0}</button>
        <button class="react-btn" onclick="react('${id}','fire')">🔥 ${data.reactions?.fire || 0}</button>
        <button class="react-btn" onclick="react('${id}','laugh')">😂 ${data.reactions?.laugh || 0}</button>
      </div>
    </div>`;
  });
});

// ===== REACTIONS =====
window.react = async (id, type) => {
  const postRef = doc(db, "requests", id);
  await updateDoc(postRef, { [`reactions.${type}`]: increment(1) });
};

// ===== PRIVATE CHAT =====
function getChatId(uid1, uid2) {
  return [uid1, uid2].sort().join("_");
}

let currentChatUser = null;
document.getElementById("chatUserSelect").onchange = (e) => {
  currentChatUser = e.target.value;
  if (currentChatUser) listenPrivateChat(currentChatUser);
};

function listenPrivateChat(withUid) {
  const chatId = getChatId(currentUser.uid, withUid);
  const messagesRef = collection(db, "conversations", chatId, "messages");
  onSnapshot(query(messagesRef, orderBy("timestamp")), snap => {
    const box = document.getElementById("chatMessages");
    box.innerHTML = "";
    snap.forEach(d => {
      const data = d.data();
      const isMe = data.from === currentUser.uid;
      box.innerHTML += `<div><b>${isMe ? "Ты" : "Он"}:</b> ${data.text}</div>`;
    });
  });
}

document.getElementById("sendChatBtn").onclick = async () => {
  if (!currentChatUser) return alert("Выберите собеседника!");
  const text = document.getElementById("chatInput").value;
  if (!text) return;
  const chatId = getChatId(currentUser.uid, currentChatUser);
  await addDoc(collection(db, "conversations", chatId, "messages"), {
    from: currentUser.uid,
    to: currentChatUser,
    text,
    timestamp: serverTimestamp()
  });
  document.getElementById("chatInput").value = "";
};
</script>
</body>
</html>
