<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud App — Панель управления</title>

<style>
body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }

.container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }

.auth-card { text-align: center; }

#loginBtn { background: white; color: #444; border: 1px solid #dadce0; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; }

.user-info { display: none; align-items: center; justify-content: space-between; width: 100%; }

.user-profile { display: flex; align-items: center; gap: 12px; }

.user-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #007bff; }

input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; }

#mainBtn { background: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; }

.post { background: white; border: 1px solid #f0f0f0; padding: 20px; margin-top: 15px; border-radius: 12px; position: relative; }

.post img { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 400px; object-fit: cover; }

.time { font-size: 12px; color: #9ca3af; position: absolute; top: 20px; right: 20px; }

.actions { display: flex; gap: 8px; margin-top: 15px; }

button.react-btn { cursor: pointer; padding: 6px 14px; border-radius: 20px; border: 1px solid #eee; background: white; }

.del-btn { margin-left: auto; background: none; border: none; color: red; cursor: pointer; }

/* ===== ACCOUNTS ===== */
#accountBar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }

.accountChip {
    font-size: 12px;
    padding: 5px 10px;
    border-radius: 20px;
    background: #e5e7eb;
    cursor: pointer;
}

.accountChip.active {
    background: #007bff;
    color: white;
}

/* ===== CHAT ===== */
#chatMessages {
    height: 200px;
    overflow-y: auto;
    border: 1px solid #eee;
    padding: 10px;
    border-radius: 8px;
    margin-bottom: 10px;
}

#sendChatBtn {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, #007bff, #00c6ff);
    color: white;
    font-weight: 600;
    cursor: pointer;
}

#chatInput {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    margin-bottom: 10px;
    border-radius: 10px;
    border: 1px solid #ddd;
}

/* ===== DM ===== */
#dmBox, #dmChat {
    display: none;
}

.userItem {
    padding: 10px;
    background: #f3f3f3;
    margin: 5px 0;
    border-radius: 8px;
    cursor: pointer;
}

.userItem:hover {
    background: #e8e8e8;
}
</style>
</head>

<body>

<!-- ACCOUNTS -->
<div class="container">
    <div id="accountBar"></div>
</div>

<!-- AUTH -->
<div class="container auth-card">
    <div id="loggedOutUI">
        <button id="loginBtn">Войти через Google</button>
    </div>

    <div id="userInfo" class="user-info">
        <div class="user-profile">
            <img id="userPhoto" class="user-avatar">
            <span id="userName"></span>
        </div>
        <button id="logoutBtn">Выйти</button>
    </div>
</div>

<!-- POST -->
<div id="messageForm" class="container" style="display:none;">
    <h3>Создать пост</h3>
    <input type="text" id="nameInput" readonly>
    <input type="text" id="contentInput" placeholder="Текст...">
    <input type="text" id="imageUrlInput" placeholder="Ссылка на картинку">
    <button id="mainBtn">Опубликовать</button>
</div>

<!-- CHAT -->
<div id="chatBox" class="container" style="display:none;">
    <h3>Общий чат</h3>

    <div id="chatMessages"></div>

    <input type="text" id="chatInput" placeholder="Сообщение...">
    <button id="sendChatBtn">Отправить</button>
</div>

<!-- DM USERS -->
<div id="dmBox" class="container">
    <h3>Личные сообщения</h3>
    <div id="userList"></div>
</div>

<!-- DM CHAT -->
<div id="dmChat" class="container">
    <h3 id="dmTitle">Чат</h3>
    <div id="dmMessages" style="height:200px;overflow-y:auto;border:1px solid #eee;padding:10px;border-radius:8px;"></div>

    <input id="dmInput" placeholder="Сообщение...">
    <button id="dmSend" style="width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,#007bff,#00c6ff);color:white;">
        Отправить
    </button>
</div>

<!-- FEED -->
<div id="feed" style="max-width:500px;width:100%;"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDZcurSOkEfsL4gqdGAgVE9Kcxuw9YN2xs",
authDomain: "yusuf-5c586.firebaseapp.com",
projectId: "yusuf-5c586",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

/* ===== USERS ===== */
let accounts = JSON.parse(localStorage.getItem("accounts") || "[]");
let currentAccount = null;

/* ===== DM ===== */
const users = [
{uid:"u1",name:"Али"},
{uid:"u2",name:"Дана"},
{uid:"u3",name:"Арман"}
];

let selectedUser = null;
let dmChatId = null;

/* ===== AUTH ===== */
document.getElementById('loginBtn').onclick =
() => signInWithPopup(auth, provider);

document.getElementById('logoutBtn').onclick =
() => signOut(auth);

onAuthStateChanged(auth, (user) => {
if (user) {
    if(!accounts.find(a=>a.uid===user.uid)){
        accounts.push({
            uid:user.uid,
            name:user.displayName,
            photo:user.photoURL
        });
        localStorage.setItem("accounts",JSON.stringify(accounts));
    }

    currentAccount = user.uid;

    const acc = accounts.find(a=>a.uid===user.uid);

    document.getElementById("userName").innerText = acc.name;
    document.getElementById("userPhoto").src = acc.photo;

    document.getElementById("userInfo").style.display="flex";
    document.getElementById("messageForm").style.display="block";
    document.getElementById("chatBox").style.display="block";

    loadUsers();
}
});

/* ===== POST ===== */
document.getElementById('mainBtn').onclick = async () => {
await addDoc(collection(db,"requests"),{
name: accounts.find(a=>a.uid===currentAccount).name,
text: document.getElementById('contentInput').value,
imageUrl: document.getElementById('imageUrlInput').value,
reactions:{like:0,fire:0,laugh:0},
timestamp:serverTimestamp()
});
};

/* ===== FEED ===== */
const q = query(collection(db,"requests"),orderBy("timestamp","desc"));

onSnapshot(q,(snap)=>{
const feed=document.getElementById("feed");
feed.innerHTML="";

snap.forEach(d=>{
const data=d.data();

feed.innerHTML+=`
<div class="post">
<b>${data.name}</b>
<p>${data.text||""}</p>
${data.imageUrl?`<img src="${data.imageUrl}">`:""}
</div>`;
});
});

/* ===== CHAT ===== */
const chatRef = collection(db,"chat");

document.getElementById("sendChatBtn").onclick = async ()=>{
const text=document.getElementById("chatInput").value;
if(!text) return;

await addDoc(chatRef,{
name: accounts.find(a=>a.uid===currentAccount).name,
text,
timestamp:serverTimestamp()
});
};

onSnapshot(query(chatRef,orderBy("timestamp")),(snap)=>{
const box=document.getElementById("chatMessages");
box.innerHTML="";
snap.forEach(d=>{
box.innerHTML+=`<div><b>${d.data().name}:</b> ${d.data().text}</div>`;
});
});

/* ===== DM SYSTEM ===== */
function loadUsers(){
const box=document.getElementById("userList");
box.innerHTML="";

users.forEach(u=>{
const div=document.createElement("div");
div.className="userItem";
div.innerText=u.name;

div.onclick=()=>{
openDM(u);
};

box.appendChild(div);
});
}

function getDMId(a,b){
return [a,b].sort().join("_");
}

function openDM(user){
selectedUser=user;
dmChatId=getDMId(currentAccount,user.uid);

document.getElementById("dmChat").style.display="block";
document.getElementById("dmTitle").innerText="Чат с "+user.name;

listenDM();
}

document.getElementById("dmSend").onclick = async ()=>{
const text=document.getElementById("dmInput").value;
if(!text) return;

await addDoc(collection(db,"conversations",dmChatId,"messages"),{
from:currentAccount,
to:selectedUser.uid,
text,
timestamp:serverTimestamp()
});

document.getElementById("dmInput").value="";
};

function listenDM(){
const q=query(
collection(db,"conversations",dmChatId,"messages"),
orderBy("timestamp")
);

onSnapshot(q,(snap)=>{
const box=document.getElementById("dmMessages");
box.innerHTML="";

snap.forEach(d=>{
const m=d.data();

box.innerHTML+=`
<div><b>${m.from===currentAccount?"Вы":selectedUser.name}:</b> ${m.text}</div>`;
});
});
}

</script>

</body>
</html>
