<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cloud App — Панель управления</title>

<style>
body {
    font-family: 'Inter', sans-serif;
    background: #f0f2f5;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    margin: 0;
}

.container {
    width: 100%;
    max-width: 500px;
    background: white;
    padding: 25px;
    border-radius: 16px;
    margin-bottom: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.05);
}

.user-info {
    display: none;
    justify-content: space-between;
    align-items: center;
}

.user-profile {
    display: flex;
    align-items: center;
    gap: 10px;
}

.user-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #007bff;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
}

button {
    cursor: pointer;
}

#accountBar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 10px;
}

.accountChip {
    background: #e5e7eb;
    padding: 6px 10px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
}

.accountChip.active {
    background: #007bff;
    color: white;
}

.post {
    background: white;
    padding: 15px;
    margin-top: 10px;
    border-radius: 12px;
    position: relative;
}

.post img {
    width: 100%;
    border-radius: 10px;
}

</style>
</head>

<body>

<div class="container">

<div id="accountBar"></div>

<button id="loginBtn">Войти через Google</button>

<div id="userInfo" class="user-info">
    <div class="user-profile">
        <img id="userPhoto" class="user-avatar">
        <span id="userName"></span>
    </div>
    <button id="logoutBtn">Выйти</button>
</div>

</div>

<div class="container" id="form" style="display:none;">
    <input id="contentInput" placeholder="Текст">
    <input id="imageUrlInput" placeholder="Картинка">
    <button id="mainBtn">Опубликовать</button>
</div>

<div id="feed" class="container"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import {
getFirestore,
collection, addDoc, query, orderBy,
onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDZcurSOkEfsL4gqdGAgVE9Kcxuw9YN2xs",
authDomain: "yusuf-5c586.firebaseapp.com",
projectId: "yusuf-5c586"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

/* 🔥 FIX LOGIN SELECT ACCOUNT */
const provider = new GoogleAuthProvider();
provider.setCustomParameters({ prompt: "select_account" });

/* ===== MULTI ACCOUNT STORAGE ===== */
let accounts = JSON.parse(localStorage.getItem("accounts") || "[]");
let currentAccount = null;

function saveAccounts(user) {
    if (!accounts.find(a => a.uid === user.uid)) {
        accounts.push({
            uid: user.uid,
            name: user.displayName,
            photo: user.photoURL
        });
        localStorage.setItem("accounts", JSON.stringify(accounts));
    }
    renderAccounts();
}

function renderAccounts() {
    const bar = document.getElementById("accountBar");
    bar.innerHTML = "";

    accounts.forEach(acc => {
        const div = document.createElement("div");
        div.className = "accountChip " + (acc.uid === currentAccount ? "active" : "");
        div.innerText = acc.name;

        div.onclick = () => switchAccount(acc.uid);

        bar.appendChild(div);
    });
}

function switchAccount(uid) {
    const acc = accounts.find(a => a.uid === uid);
    if (!acc) return;

    currentAccount = uid;

    document.getElementById("userName").innerText = acc.name;
    document.getElementById("userPhoto").src = acc.photo;

    document.getElementById("userInfo").style.display = "flex";
    document.getElementById("form").style.display = "block";

    renderAccounts();
}

/* AUTH */
document.getElementById("loginBtn").onclick =
() => signInWithPopup(auth, provider);

document.getElementById("logoutBtn").onclick =
() => signOut(auth);

onAuthStateChanged(auth, (user) => {

if (user) {
    saveAccounts(user);
    currentAccount = user.uid;
    switchAccount(user.uid);
}
});

/* POSTS */
document.getElementById("mainBtn").onclick = async () => {
await addDoc(collection(db,"requests"),{
name: accounts.find(a => a.uid === currentAccount).name,
text: contentInput.value,
imageUrl: imageUrlInput.value || null,
timestamp: serverTimestamp()
});

contentInput.value = "";
imageUrlInput.value = "";
};

/* FEED */
const q = query(collection(db,"requests"),orderBy("timestamp","desc"));

onSnapshot(q,(snap)=>{
const feed=document.getElementById("feed");
feed.innerHTML="";

snap.forEach(d=>{
const data=d.data();

feed.innerHTML += `
<div class="post">
<b>${data.name}</b>
<p>${data.text || ""}</p>
${data.imageUrl ? `<img src="${data.imageUrl}">` : ""}
</div>`;
});
});

</script>

</body>
</html>
