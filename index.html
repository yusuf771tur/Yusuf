<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статуса группы — Топ студенты и Достижения</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            padding: 28px;
            margin-bottom: 20px;
        }

        h2 {
            margin: 0 0 20px 0;
            font-size: 1.3rem;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        h2::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 2px;
        }

        #myInfo {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .user-info-flex {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar-large {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .avatar-placeholder-large {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: white;
        }

        .user-name {
            font-weight: 600;
            color: #1a1a1a;
        }

        .user-email {
            font-size: 12px;
            color: #6c757d;
        }

        .status-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 16px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            transform: translateY(-1px);
            filter: brightness(1.05);
        }

        .btn-study { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; }
        .btn-coffee { background: linear-gradient(135deg, #f2994a 0%, #f2c94c 100%); color: #333; }
        .btn-game { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white; }
        .btn-home { background: linear-gradient(135deg, #8e9eab 0%, #eef2f3 100%); color: #333; }
        .btn-google { background: linear-gradient(135deg, #4285F4 0%, #34A853 100%); color: white; }
        .btn-email { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-danger { background: linear-gradient(135deg, #dc3545 0%, #c82333 100%); color: white; }
        .btn-secondary-dark { background: linear-gradient(135deg, #6c757d 0%, #495057 100%); color: white; }

        .session-timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            padding: 10px;
            background: #fdfdfd;
            border: 1px solid #e9ecef;
            border-radius: 12px;
        }

        .timer-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0d6efd;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .session-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        .user-item {
            display: flex;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .top-student {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 12px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
        }
        
        .top-student-name {
            font-weight: bold;
            color: #1a1a1a;
        }
        
        .top-student-time {
            color: #11998e;
            font-weight: bold;
        }
        
        .achievement-item {
            background: #fff7e6;
            border: 1px solid #ffd591;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }
        
        .achievement-title {
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .achievement-desc {
            font-size: 13px;
            color: #666;
        }

        .user-avatar, .user-avatar-placeholder {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            margin-right: 14px;
            flex-shrink: 0;
        }
        .user-avatar-placeholder {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
        }
        .user-info {
            flex-grow: 1;
        }
        .username {
            font-weight: 600;
        }
        .status-text {
            font-size: 0.85rem;
            color: #6c757d;
        }
        .logout-btn {
            background: linear-gradient(135deg, #dc3545 0%, #c82333 100%);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            cursor: pointer;
        }
        .status-buttons.disabled, .session-timer-container.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .loading {
            text-align: center;
            color: #6c757d;
            padding: 30px;
        }
        .online-count {
            background: #28a745;
            color: white;
            border-radius: 20px;
            padding: 2px 10px;
            font-size: 0.75rem;
            margin-left: 10px;
        }
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 400px;
            width: 90%;
        }
        .modal-content input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .btn-modal {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }
        .btn-primary { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; }
        .btn-secondary { background: #6c757d; color: white; }
        .error-message { color: #dc3545; font-size: 12px; display: none; margin-top: 5px; }
        .chat-messages {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 15px;
            height: 200px;
            overflow-y: auto;
            margin-bottom: 12px;
        }
        .chat-message-item {
            margin-bottom: 8px;
        }
        .chat-message-author { font-weight: bold; }
        .chat-input-container {
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .btn-send {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            border: none;
            border-radius: 10px;
            width: 44px;
            height: 44px;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card"><h2>👤 Мой профиль</h2><div id="myInfo"><div class="loading">Загрузка...</div></div>
    <div id="statusButtons" class="status-buttons">
        <button class="btn btn-study" onclick="window.changeStatus('📚 Учусь')">📚 Учусь</button>
        <button class="btn btn-coffee" onclick="window.changeStatus('☕ Пью кофе')">☕ Кофе</button>
        <button class="btn btn-game" onclick="window.changeStatus('🎮 В игре')">🎮 В игре</button>
        <button class="btn btn-home" onclick="window.changeStatus('🏠 Дома')">🏠 Дома</button>
    </div>
    <div id="sessionContainer" class="session-timer-container disabled">
        <div class="timer-display">⏱️ <span id="timerClock">0 сек.</span></div>
        <div class="session-controls">
            <button class="btn btn-danger" onclick="window.stopSession()">⛔ Завершить сессию</button>
            <button class="btn btn-coffee" id="pauseBtn" onclick="window.togglePause()">☕ Перерыв</button>
        </div>
    </div></div>

    <div class="card"><h2>👥 Монитор группы <span id="usersCount" class="online-count">0</span></h2><div id="groupList"></div></div>
    <div class="card"><h2>🏆 Топ студентов (по учебному времени)</h2><div id="topStudents"><div class="loading">Загрузка рейтинга...</div></div></div>
    <div class="card"><h2>🎖️ Мои достижения</h2><div id="achievementsList"><div class="loading">Загрузка достижений...</div></div></div>
    <div class="card"><h2>💬 Общий чат</h2><div id="chatMessages" class="chat-messages"><div class="loading">Вход не выполнен</div></div>
    <div class="chat-input-container"><input type="text" id="chatInput" class="chat-input" placeholder="Сообщение..." onkeypress="if(event.key === 'Enter') window.sendChatMessage()"><button class="btn-send" onclick="window.sendChatMessage()">➤</button></div></div>
</div>
<div id="emailModal" class="modal"><div class="modal-content"><h3 id="modalTitle">📝 Регистрация</h3><input type="email" id="emailInput" placeholder="Email"><input type="password" id="passwordInput" placeholder="Пароль (мин. 6 символов)"><div id="errorMessage" class="error-message"></div><button class="btn-modal btn-primary" id="modalSubmitBtn">Зарегистрироваться</button><button class="btn-modal btn-secondary" onclick="window.closeEmailModal()">Отмена</button></div></div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'
    const SUPABASE_URL = 'https://qbykreduhwmlriyuhnxs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFieWtyZWR1aHdtbHJpeXVobnhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQ1MzcsImV4cCI6MjA5MjI2MDUzN30.hT3f3TIZfiZ044tmaS899sUS-2O9MspbAFvldG8e-hQ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    let sessionSeconds = 0, timerInterval = null, isPaused = false;
    let currentUserAchievements = []; // массив названий для быстрой проверки

    const getCurrentUrl = () => window.location.href.split('#')[0].split('?')[0];
    window.loginWithGoogle = async () => {
        try { await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: getCurrentUrl() } });
        } catch(e) { alert('Ошибка: '+e.message); }
    };
    window.openEmailModal = (type) => {
        const modal = document.getElementById('emailModal');
        document.getElementById('emailInput').value = '';
        document.getElementById('passwordInput').value = '';
        document.getElementById('errorMessage').style.display = 'none';
        const title = document.getElementById('modalTitle'), btn = document.getElementById('modalSubmitBtn');
        if(type === 'register'){ title.textContent='📝 Регистрация'; btn.textContent='Зарегистрироваться'; btn.onclick = () => registerWithEmail(); }
        else { title.textContent='🔐 Вход'; btn.textContent='Войти'; btn.onclick = () => loginWithEmail(); }
        modal.style.display='flex';
    };
    window.closeEmailModal = () => document.getElementById('emailModal').style.display='none';
    async function registerWithEmail(){
        const email = document.getElementById('emailInput').value, pass = document.getElementById('passwordInput').value, errDiv = document.getElementById('errorMessage');
        errDiv.style.display='none';
        if(!email || !pass){ errDiv.textContent='Заполните поля'; errDiv.style.display='block'; return; }
        if(pass.length<6){ errDiv.textContent='Пароль ≥6 символов'; errDiv.style.display='block'; return; }
        try {
            const { error } = await supabase.auth.signUp({ email, password: pass, options: { data: { full_name: email.split('@')[0] } } });
            if(error) throw error;
            alert('Регистрация успешна! Подтвердите email.');
            closeEmailModal();
        } catch(e){ errDiv.textContent='Ошибка: '+e.message; errDiv.style.display='block'; }
    }
    async function loginWithEmail(){
        const email = document.getElementById('emailInput').value, pass = document.getElementById('passwordInput').value, errDiv = document.getElementById('errorMessage');
        errDiv.style.display='none';
        try {
            const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
            if(error) throw error;
            closeEmailModal();
        } catch(e){ errDiv.textContent='Ошибка: '+e.message; errDiv.style.display='block'; }
    }
    window.logout = async () => { window.stopTimer(); await supabase.auth.signOut(); window.location.reload(); };
    window.changeStatus = async (status) => {
        const { data: { user } } = await supabase.auth.getUser();
        if(!user){ alert('Войдите в аккаунт'); return; }
        await supabase.from('profiles').upsert({ id: user.id, username: user.user_metadata.full_name || user.email, avatar_url: user.user_metadata.avatar_url, status, updated_at: new Date() });
        fetchGroup();
        if(status === '📚 Учусь' && isPaused) { isPaused = false; document.getElementById('pauseBtn').textContent='☕ Перерыв'; }
        else if(status !== '📚 Учусь' && !isPaused && timerInterval) { /* если меняем статус не на учебу, но пауза не активна — ничего */ }
    };
    const getStatusEmoji = (s) => s?.includes('Учусь')?'📚':s?.includes('Кофе')?'☕':s?.includes('Игре')?'🎮':s?.includes('Дома')?'🏠':'💬';
    function escapeHtml(t){ if(!t) return ''; const div = document.createElement('div'); div.textContent = t; return div.innerHTML; }
    async function fetchGroup(){
        const { data: profiles } = await supabase.from('profiles').select('id, username, status, avatar_url').order('username');
        const listDiv = document.getElementById('groupList'), countSpan = document.getElementById('usersCount');
        if(!profiles?.length){ listDiv.innerHTML='<div class="loading">👻 Пока нет пользователей</div>'; countSpan.textContent='0'; return; }
        countSpan.textContent = profiles.length;
        listDiv.innerHTML = profiles.map(u => `<div class="user-item">${u.avatar_url && u.avatar_url!=='null' ? `<img class="user-avatar" src="${escapeHtml(u.avatar_url)}" style="width:44px;height:44px;border-radius:50%;margin-right:14px;">` : `<div class="user-avatar-placeholder" style="width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#667eea,#764ba2);margin-right:14px;">${getStatusEmoji(u.status)}</div>`}<div class="user-info"><div class="username">${escapeHtml(u.username||'Аноним')}</div><div class="status-text">${escapeHtml(u.status||'Статус не задан')}</div></div></div>`).join('');
    }
    window.startTimer = () => { if(timerInterval) clearInterval(timerInterval); sessionSeconds=0; isPaused=false; document.getElementById('pauseBtn').textContent='☕ Перерыв'; updateTimerDisplay(); timerInterval = setInterval(()=>{ if(!isPaused){ sessionSeconds++; updateTimerDisplay(); checkMarathonAchievement(); } },1000); };
    window.stopTimer = () => { if(timerInterval) clearInterval(timerInterval); timerInterval=null; };
    function updateTimerDisplay(){ const clock = document.getElementById('timerClock'); if(sessionSeconds<60) clock.textContent=`${sessionSeconds} сек.`; else clock.textContent=`${Math.floor(sessionSeconds/60)} мин. ${sessionSeconds%60} сек.`; }
    window.togglePause = () => { isPaused=!isPaused; document.getElementById('pauseBtn').textContent = isPaused ? '▶️ Продолжить' : '☕ Перерыв'; window.changeStatus(isPaused ? '☕ Перерыв' : '📚 Учусь'); };
    window.stopSession = () => { window.stopTimer(); window.changeStatus('🏠 Дома'); window.startTimer(); };
    window.fetchChatMessages = async () => {
        const { data: msgs } = await supabase.from('messages').select('id, username, text, created_at').order('created_at',{ascending:true}).limit(50);
        const container = document.getElementById('chatMessages');
        if(!msgs?.length){ container.innerHTML='<div class="loading">Нет сообщений</div>'; return; }
        container.innerHTML = msgs.map(m => `<div class="chat-message-item"><span class="chat-message-author">${escapeHtml(m.username)}:</span> ${escapeHtml(m.text)}</div>`).join('');
        container.scrollTop = container.scrollHeight;
    };
    window.sendChatMessage = async () => {
        const input = document.getElementById('chatInput'), text = input.value.trim();
        if(!text) return;
        const { data: { user } } = await supabase.auth.getUser();
        if(!user){ alert('Войдите чтобы писать'); return; }
        const username = user.user_metadata.full_name || user.email;
        await supabase.from('messages').insert({ username, text });
        input.value = '';
        fetchChatMessages();
        updateAchievementsByMessageCount(); // проверяем активиста
    };
    // ----- РЕЙТИНГ ТОП СТУДЕНТОВ (по учебным секундам) -----
    async function loadTopStudents(){
        const { data: stats, error } = await supabase.from('study_stats').select('user_id, total_seconds').order('total_seconds', { ascending: false }).limit(10);
        if(error || !stats?.length){ document.getElementById('topStudents').innerHTML='<div class="loading">Нет данных об учебе</div>'; return; }
        const userIds = stats.map(s => s.user_id);
        const { data: profiles } = await supabase.from('profiles').select('id, username').in('id', userIds);
        const map = new Map(profiles?.map(p=>[p.id, p.username])||[]);
        let html = '';
        for(let s of stats){
            const name = map.get(s.user_id) || 'Студент';
            const hours = Math.floor(s.total_seconds / 3600), minutes = Math.floor((s.total_seconds % 3600)/60);
            html += `<div class="top-student"><span class="top-student-name">🏅 ${escapeHtml(name)}</span><span class="top-student-time">${hours}ч ${minutes}мин</span></div>`;
        }
        document.getElementById('topStudents').innerHTML = html || '<div class="loading">Нет данных</div>';
    }
    // Сохранение учебного времени в study_stats (каждые 30 сек или при завершении)
    async function saveStudySeconds(secondsToAdd){
        const { data: { user } } = await supabase.auth.getUser();
        if(!user || secondsToAdd===0) return;
        const { data: existing } = await supabase.from('study_stats').select('total_seconds').eq('user_id', user.id).single();
        if(existing){
            await supabase.from('study_stats').update({ total_seconds: existing.total_seconds + secondsToAdd, updated_at: new Date() }).eq('user_id', user.id);
        } else {
            await supabase.from('study_stats').insert({ user_id: user.id, total_seconds: secondsToAdd });
        }
        loadTopStudents();
        // после добавления времени проверим достижение "Марафонец" (более 2 часов за раз)
        const { data: fresh } = await supabase.from('study_stats').select('total_seconds').eq('user_id', user.id).single();
        if(fresh && fresh.total_seconds >= 7200) await unlockAchievement(user.id, 'Марафонец', 'Проучился более 2 часов суммарно');
        // Также проверим "Первая сессия" (награда за первую сохраненную секунду)
        if(secondsToAdd > 0 && existing?.total_seconds === undefined) await unlockAchievement(user.id, 'Первые шаги', 'Начал учебную сессию');
    }
    // Достижение "Ранняя пташка" (вход до 8:00)
    async function checkEarlyBird(userId, createdAt){
        if(!createdAt) return;
        const hour = new Date(createdAt).getHours();
        if(hour < 8){
            await unlockAchievement(userId, 'Ранняя пташка', 'Зашел в систему до 8:00');
        }
    }
    // Достижение "Активист" (20 сообщений)
    async function updateAchievementsByMessageCount(){
        const { data: { user } } = await supabase.auth.getUser();
        if(!user) return;
        const { count } = await supabase.from('messages').select('*', { count: 'exact', head: true }).eq('username', user.user_metadata.full_name || user.email);
        if(count >= 20) await unlockAchievement(user.id, 'Активист', 'Написал 20 сообщений в общем чате');
    }
    // Марафонец вызывается каждую секунду (если сессия > 7200)
    async function checkMarathonAchievement(){
        if(sessionSeconds >= 7200){
            const { data: { user } } = await supabase.auth.getUser();
            if(user) await unlockAchievement(user.id, 'Марафонец', 'Проучился более 2 часов за раз');
        }
    }
    // универсальная выдача достижений
    async function unlockAchievement(userId, title, description){
        const { data: existing } = await supabase.from('achievements').select('id').eq('user_id', userId).eq('title', title).single();
        if(!existing){
            await supabase.from('achievements').insert({ user_id: userId, title, description, earned_at: new Date() });
            loadUserAchievements();
        }
    }
    async function loadUserAchievements(){
        const { data: { user } } = await supabase.auth.getUser();
        if(!user){ document.getElementById('achievementsList').innerHTML='<div class="loading">Войдите для просмотра достижений</div>'; return; }
        const { data: list } = await supabase.from('achievements').select('title, description, earned_at').eq('user_id', user.id).order('earned_at',{ascending:false});
        currentUserAchievements = list?.map(a=>a.title) || [];
        if(!list?.length){ document.getElementById('achievementsList').innerHTML='<div class="loading">Пока нет достижений. Учись, пиши в чат, заходи рано утром!</div>'; return; }
        let html = '';
        for(let a of list){
            html += `<div class="achievement-item"><div class="achievement-title">🏅 ${escapeHtml(a.title)}</div><div class="achievement-desc">${escapeHtml(a.description)}</div><div style="font-size:11px; color:#999;">${new Date(a.earned_at).toLocaleDateString()}</div></div>`;
        }
        document.getElementById('achievementsList').innerHTML = html;
    }
    // синхронизация статистики учебы (периодически)
    let lastSavedSeconds = 0;
    async function syncStudyTimePeriodically(){
        if(timerInterval && !isPaused && sessionSeconds - lastSavedSeconds >= 30){
            const delta = sessionSeconds - lastSavedSeconds;
            await saveStudySeconds(delta);
            lastSavedSeconds = sessionSeconds;
        }
        setTimeout(syncStudyTimePeriodically, 30000);
    }
    // при завершении сессии / выходе сохраняем остаток
    window.addEventListener('beforeunload', async () => {
        if(timerInterval && !isPaused && sessionSeconds > lastSavedSeconds){
            const delta = sessionSeconds - lastSavedSeconds;
            await saveStudySeconds(delta);
        }
    });
    // проверка пользователя + подписки
    async function checkUser() {
        const { data: { user } } = await supabase.auth.getUser();
        const statusDiv = document.getElementById('statusButtons'), sessionDiv = document.getElementById('sessionContainer'), myInfoDiv = document.getElementById('myInfo');
        if(user){
            const avatar = user.user_metadata.avatar_url, userName = user.user_metadata.full_name || user.email;
            myInfoDiv.innerHTML = `<div class="user-profile"><div class="user-info-flex">${avatar?`<img class="user-avatar-large" src="${escapeHtml(avatar)}">`:`<div class="avatar-placeholder-large">${userName.charAt(0)}</div>`}<div><div class="user-name">${escapeHtml(userName)}</div><div class="user-email">${escapeHtml(user.email)}</div></div></div><button class="logout-btn" onclick="window.logout()">🚪 Выйти</button></div>`;
            statusDiv.classList.remove('disabled'); sessionDiv.classList.remove('disabled');
            if(!timerInterval) window.startTimer();
            await fetchChatMessages();
            // проверка/создание профиля
            const { data: profile } = await supabase.from('profiles').select('id').eq('id', user.id).single();
            if(!profile){
                await supabase.from('profiles').insert({ id: user.id, username: userName, avatar_url: avatar, status: '🏠 Дома' });
                await fetchGroup();
            } else {
                await fetchGroup();
            }
            // проверка ранней пташки по created_at пользователя
            if(user.created_at) await checkEarlyBird(user.id, user.created_at);
            await loadUserAchievements();
            await loadTopStudents();
            // также проверим активиста при каждом обновлении
            await updateAchievementsByMessageCount();
            // инициализируем lastSavedSeconds текущей сессией (уже есть)
            lastSavedSeconds = sessionSeconds;
        } else {
            myInfoDiv.innerHTML = `<div class="auth-buttons"><button class="btn btn-email" onclick="window.openEmailModal('register')">📝 Регистрация</button><button class="btn btn-email" onclick="window.openEmailModal('login')">🔐 Вход по email</button><button class="btn btn-google" onclick="window.loginWithGoogle()">🚀 Войти через Google</button></div>`;
            statusDiv.classList.add('disabled'); sessionDiv.classList.add('disabled');
            document.getElementById('chatMessages').innerHTML='<div class="loading">Вход не выполнен</div>';
            window.stopTimer();
        }
    }
    function subscribeToChanges(){
        supabase.channel('profiles_changes').on('postgres_changes',{event:'*',schema:'public',table:'profiles'},()=>fetchGroup()).subscribe();
        supabase.channel('messages_changes').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},()=>{fetchChatMessages(); updateAchievementsByMessageCount();}).subscribe();
        supabase.channel('stats_changes').on('postgres_changes',{event:'*',schema:'public',table:'study_stats'},()=>loadTopStudents()).subscribe();
    }
    async function init(){
        await supabase.auth.getSession().then(({ data: { session } })=>{ if(session) console.log('session'); });
        await checkUser();
        subscribeToChanges();
        setInterval(fetchGroup, 30000);
        syncStudyTimePeriodically();
        // при загрузке также проверим любые накопленные секунды - стартуем таймер с нуля
    }
    init();
    window.onclick = (e) => { if(e.target === document.getElementById('emailModal')) closeEmailModal(); };
</script>
</body>
</html>
