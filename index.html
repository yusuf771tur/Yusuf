<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REAL TIME MONITOR | Монитор статуса группы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            font-family: 'Segoe UI', 'Courier New', monospace;
            padding: 20px;
            min-height: 100vh;
        }

        /* Стиль как на фото - тёмный терминальный стиль */
        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        .monitor-card {
            background: #0f0f1a;
            border: 2px solid #2a2a3e;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .card-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #0d0d1a 100%);
            padding: 14px 20px;
            border-bottom: 1px solid #2a2a3e;
            font-weight: bold;
            font-size: 1rem;
            letter-spacing: 1px;
        }

        .card-header h2 {
            font-size: 1rem;
            margin: 0;
            color: #00ff88;
            text-transform: uppercase;
            font-family: monospace;
        }

        .card-content {
            padding: 20px;
        }

        /* Сессия учебы */
        .session-box {
            background: #0a0a12;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #2a2a3e;
        }

        .session-title {
            color: #ffd700;
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 0.9rem;
            text-transform: uppercase;
        }

        .user-name-large {
            color: #00ff88;
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 10px;
            word-break: break-all;
        }

        .timer-box {
            background: #000000;
            padding: 12px;
            border-radius: 6px;
            margin: 12px 0;
            text-align: center;
        }

        .timer-value {
            font-size: 2rem;
            font-weight: bold;
            color: #00ff88;
            font-family: monospace;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            background: #ff6600;
            color: white;
            border-radius: 4px;
            font-size: 0.8rem;
            margin: 8px 0;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .btn-term {
            background: #1a1a2e;
            border: 1px solid #3a3a5e;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .btn-term:hover {
            background: #2a2a4e;
            border-color: #00ff88;
            color: #00ff88;
        }

        .btn-danger {
            border-color: #ff4444;
            color: #ff4444;
        }

        .btn-danger:hover {
            background: #ff4444;
            color: white;
        }

        /* Список профилей - как на фото */
        .profile-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .profile-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a2e;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .profile-name {
            color: #00ff88;
            font-weight: bold;
        }

        .profile-status {
            color: #ffaa44;
        }

        .profile-time {
            color: #888;
            font-size: 0.75rem;
        }

        /* Топ студентов */
        .top-student-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #1a1a2e;
        }

        .top-rank {
            color: #ffd700;
            font-weight: bold;
            width: 40px;
        }

        .top-name {
            color: #00ff88;
            flex: 1;
        }

        .top-time {
            color: #ffaa44;
        }

        /* Достижения */
        .achievement-item {
            background: #0a0a12;
            border-left: 3px solid #ffd700;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 4px;
        }

        .achievement-title {
            color: #ffd700;
            font-weight: bold;
            font-size: 0.85rem;
        }

        .achievement-desc {
            color: #888;
            font-size: 0.75rem;
        }

        /* Чат - как на фото */
        .chat-window {
            background: #0a0a12;
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            padding: 12px;
            margin-bottom: 12px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .chat-message {
            padding: 6px 0;
            border-bottom: 1px solid #1a1a2e;
            color: #ccc;
        }

        .chat-author {
            color: #00ff88;
            font-weight: bold;
        }

        .chat-text {
            color: #fff;
            margin-left: 8px;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
        }

        .chat-input {
            flex: 1;
            background: #0a0a12;
            border: 1px solid #2a2a3e;
            color: #00ff88;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
        }

        .chat-input:focus {
            outline: none;
            border-color: #00ff88;
        }

        .btn-send {
            background: #1a1a2e;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
        }

        .btn-send:hover {
            background: #00ff88;
            color: #0a0a12;
        }

        /* Кнопки статусов */
        .status-row {
            display: flex;
            gap: 10px;
            margin: 15px 0;
            flex-wrap: wrap;
        }

        .status-btn {
            padding: 8px 16px;
            background: #1a1a2e;
            border: 1px solid #3a3a5e;
            color: #ccc;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            transition: all 0.2s;
        }

        .status-btn:hover {
            transform: scale(1.02);
        }

        .status-btn[data-status="study"]:hover { border-color: #00ff88; color: #00ff88; }
        .status-btn[data-status="coffee"]:hover { border-color: #ffaa44; color: #ffaa44; }
        .status-btn[data-status="game"]:hover { border-color: #44aaff; color: #44aaff; }
        .status-btn[data-status="home"]:hover { border-color: #ff6688; color: #ff6688; }

        /* Auth buttons */
        .auth-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .auth-btn {
            background: #1a1a2e;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
            text-align: center;
        }

        .logout-btn {
            background: #1a1a2e;
            border: 1px solid #ff4444;
            color: #ff4444;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-family: monospace;
        }

        .disabled {
            opacity: 0.5;
            pointer-events: none;
        }

        .loading {
            text-align: center;
            color: #888;
            padding: 20px;
            font-family: monospace;
        }

        .online-count {
            color: #00ff88;
            background: #1a1a2e;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.7rem;
            margin-left: 8px;
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #0f0f1a;
            border: 2px solid #00ff88;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h3 {
            color: #00ff88;
            margin-bottom: 20px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0a0a12;
            border: 1px solid #2a2a3e;
            color: #00ff88;
            border-radius: 6px;
            font-family: monospace;
        }

        .error-message {
            color: #ff4444;
            font-size: 12px;
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- СЕССИЯ УЧЕБЫ -->
        <div class="monitor-card">
            <div class="card-header">
                <h2>📡 СЕССИЯ УЧЕБЫ</h2>
            </div>
            <div class="card-content">
                <div id="myInfo">...</div>
                
                <div class="status-row" id="statusButtons">
                    <button class="status-btn" data-status="study" onclick="window.changeStatus('📚 Учусь')">📚 УЧУСЬ</button>
                    <button class="status-btn" data-status="coffee" onclick="window.changeStatus('☕ ПЬЮ КОФЕ')">☕ КОФЕ</button>
                    <button class="status-btn" data-status="game" onclick="window.changeStatus('🎮 В ИГРЕ')">🎮 В ИГРЕ</button>
                    <button class="status-btn" data-status="home" onclick="window.changeStatus('🏠 ДОМА')">🏠 ДОМА</button>
                </div>

                <div id="sessionContainer" class="session-box disabled">
                    <div class="timer-box">
                        <span class="timer-value" id="timerClock">0 сек.</span>
                    </div>
                    <div class="button-group">
                        <button class="btn-term" id="pauseBtn" onclick="window.togglePause()">⏸ ПЕРЕРЫВ</button>
                        <button class="btn-term btn-danger" onclick="window.stopSession()">⛔ ЗАВЕРШИТЬ</button>
                        <button class="btn-term btn-danger" onclick="window.logout()">🚪 ВЫХОД</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- ВАШ ПРОФИЛЬ / МОНИТОР ГРУППЫ -->
        <div class="monitor-card">
            <div class="card-header">
                <h2>👥 ВАШ ПРОФИЛЬ <span id="usersCount" class="online-count">0</span></h2>
            </div>
            <div class="card-content">
                <div id="groupList" class="profile-list"></div>
            </div>
        </div>

        <!-- ТОП СТУДЕНТОВ -->
        <div class="monitor-card">
            <div class="card-header">
                <h2>🏆 ТОП СТУДЕНТОВ</h2>
            </div>
            <div class="card-content">
                <div id="topStudents"></div>
            </div>
        </div>

        <!-- ДОСТИЖЕНИЯ -->
        <div class="monitor-card">
            <div class="card-header">
                <h2>🎖️ МОИ ДОСТИЖЕНИЯ</h2>
            </div>
            <div class="card-content">
                <div id="achievementsList"></div>
            </div>
        </div>

        <!-- ОБЩИЙ ЧАТ -->
        <div class="monitor-card">
            <div class="card-header">
                <h2>💬 ОБЩИЙ ЧАТ</h2>
            </div>
            <div class="card-content">
                <div id="chatMessages" class="chat-window"></div>
                <div class="chat-input-area">
                    <input type="text" id="chatInput" class="chat-input" placeholder="Введите сообщение..." onkeypress="if(event.key === 'Enter') window.sendChatMessage()">
                    <button class="btn-send" onclick="window.sendChatMessage()">➤ ОТПРАВИТЬ</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Модальное окно -->
    <div id="emailModal" class="modal">
        <div class="modal-content">
            <h3>📝 РЕГИСТРАЦИЯ / ВХОД</h3>
            <input type="email" id="emailInput" placeholder="Email">
            <input type="password" id="passwordInput" placeholder="Пароль (мин. 6)">
            <div id="errorMessage" class="error-message"></div>
            <button class="auth-btn" id="modalSubmitBtn" style="width:100%; margin-top:10px;">Зарегистрироваться</button>
            <button class="btn-term" onclick="window.closeEmailModal()" style="width:100%; margin-top:8px;">Отмена</button>
            <button class="auth-btn" onclick="window.loginWithGoogle()" style="width:100%; margin-top:8px; border-color:#4285F4;">🚀 Войти через Google</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const SUPABASE_URL = 'https://qbykreduhwmlriyuhnxs.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFieWtyZWR1aHdtbHJpeXVobnhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQ1MzcsImV4cCI6MjA5MjI2MDUzN30.hT3f3TIZfiZ044tmaS899sUS-2O9MspbAFvldG8e-hQ';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let sessionSeconds = 0;
        let timerInterval = null;
        let isPaused = false;
        let lastSavedSeconds = 0;

        const escapeHtml = (text) => {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        };

        const getCurrentUrl = () => window.location.href.split('#')[0].split('?')[0];

        // ========== АВТОРИЗАЦИЯ ==========
        window.loginWithGoogle = async () => {
            try {
                await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: { redirectTo: getCurrentUrl() }
                });
            } catch(e) { alert('Ошибка: ' + e.message); }
        };

        window.openEmailModal = (type) => {
            const modal = document.getElementById('emailModal');
            const submitBtn = document.getElementById('modalSubmitBtn');
            document.getElementById('emailInput').value = '';
            document.getElementById('passwordInput').value = '';
            document.getElementById('errorMessage').style.display = 'none';
            
            if (type === 'register') {
                submitBtn.textContent = 'Зарегистрироваться';
                submitBtn.onclick = () => registerWithEmail();
            } else {
                submitBtn.textContent = 'Войти';
                submitBtn.onclick = () => loginWithEmail();
            }
            modal.style.display = 'flex';
        };

        window.closeEmailModal = () => {
            document.getElementById('emailModal').style.display = 'none';
        };

        async function registerWithEmail() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMessage');
            
            if (!email || !password) {
                errorMsg.textContent = 'Заполните все поля';
                errorMsg.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                errorMsg.textContent = 'Пароль должен быть не менее 6 символов';
                errorMsg.style.display = 'block';
                return;
            }
            
            try {
                const { error } = await supabase.auth.signUp({
                    email, password,
                    options: { data: { full_name: email.split('@')[0] } }
                });
                if (error) throw error;
                alert('Регистрация успешна! Проверьте почту для подтверждения.');
                closeEmailModal();
            } catch (error) {
                errorMsg.textContent = 'Ошибка: ' + error.message;
                errorMsg.style.display = 'block';
            }
        }

        async function loginWithEmail() {
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorMsg = document.getElementById('errorMessage');
            
            try {
                const { error } = await supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                closeEmailModal();
            } catch (error) {
                errorMsg.textContent = 'Ошибка: ' + error.message;
                errorMsg.style.display = 'block';
            }
        }

        window.logout = async () => {
            await saveStudySeconds(sessionSeconds - lastSavedSeconds);
            window.stopTimer();
            await supabase.auth.signOut();
            window.location.reload();
        };

        // ========== СТАТУСЫ И ТАЙМЕР ==========
        window.changeStatus = async (status) => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) { alert('Войдите в аккаунт'); return; }
            
            await supabase.from('profiles').upsert({
                id: user.id,
                username: user.user_metadata.full_name || user.email,
                avatar_url: user.user_metadata.avatar_url,
                status: status,
                updated_at: new Date()
            });
            fetchGroup();
        };

        window.startTimer = () => {
            if (timerInterval) clearInterval(timerInterval);
            sessionSeconds = 0;
            lastSavedSeconds = 0;
            isPaused = false;
            document.getElementById('pauseBtn').textContent = '⏸ ПЕРЕРЫВ';
            updateTimerDisplay();
            timerInterval = setInterval(() => {
                if (!isPaused) {
                    sessionSeconds++;
                    updateTimerDisplay();
                    if (sessionSeconds >= 7200) checkMarathonAchievement();
                }
            }, 1000);
        };

        window.stopTimer = () => {
            if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
        };

        function updateTimerDisplay() {
            const clock = document.getElementById('timerClock');
            if (sessionSeconds < 60) clock.textContent = `${sessionSeconds} сек.`;
            else clock.textContent = `${Math.floor(sessionSeconds/60)} мин. ${sessionSeconds%60} сек.`;
        }

        window.togglePause = () => {
            isPaused = !isPaused;
            const pauseBtn = document.getElementById('pauseBtn');
            if (isPaused) {
                pauseBtn.textContent = '▶️ ПРОДОЛЖИТЬ';
                window.changeStatus('☕ Перерыв');
            } else {
                pauseBtn.textContent = '⏸ ПЕРЕРЫВ';
                window.changeStatus('📚 Учусь');
            }
        };

        window.stopSession = () => {
            window.stopTimer();
            window.changeStatus('🏠 Дома');
            window.startTimer();
        };

        // ========== СОХРАНЕНИЕ ВРЕМЕНИ ==========
        async function saveStudySeconds(secondsToAdd) {
            if (secondsToAdd <= 0) return;
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;
            
            const { data: existing } = await supabase.from('study_stats').select('total_seconds').eq('user_id', user.id).single();
            if (existing) {
                await supabase.from('study_stats').update({ total_seconds: existing.total_seconds + secondsToAdd }).eq('user_id', user.id);
            } else {
                await supabase.from('study_stats').insert({ user_id: user.id, total_seconds: secondsToAdd });
                await unlockAchievement(user.id, 'Первый шаг', 'Начал первую учебную сессию');
            }
            loadTopStudents();
        }

        // ========== ДОСТИЖЕНИЯ ==========
        async function unlockAchievement(userId, title, description) {
            const { data: existing } = await supabase.from('achievements').select('id').eq('user_id', userId).eq('title', title).single();
            if (!existing) {
                await supabase.from('achievements').insert({ user_id: userId, title, description, earned_at: new Date() });
                loadUserAchievements();
            }
        }

        async function checkEarlyBird(userId, createdAt) {
            const hour = new Date(createdAt).getHours();
            if (hour < 8) await unlockAchievement(userId, 'Ранняя пташка', 'Зашел в систему до 8:00');
        }

        async function checkMarathonAchievement() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user && sessionSeconds >= 7200) {
                await unlockAchievement(user.id, 'Марафонец', 'Проучился более 2 часов за раз');
            }
        }

        async function updateAchievementsByMessageCount() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return;
            const username = user.user_metadata.full_name || user.email;
            const { count } = await supabase.from('messages').select('*', { count: 'exact', head: true }).eq('username', username);
            if (count >= 20) await unlockAchievement(user.id, 'Активист', 'Написал 20 сообщений в общем чате');
        }

        // ========== ЗАГРУЗКА ДАННЫХ ==========
        async function fetchGroup() {
            const { data: profiles } = await supabase.from('profiles').select('id, username, status').order('username');
            const listDiv = document.getElementById('groupList');
            const countSpan = document.getElementById('usersCount');
            
            if (!profiles?.length) {
                listDiv.innerHTML = '<div class="loading">👻 Нет пользователей</div>';
                countSpan.textContent = '0';
                return;
            }
            
            countSpan.textContent = profiles.length;
            listDiv.innerHTML = profiles.map(p => `
                <div class="profile-item">
                    <span class="profile-name">${escapeHtml(p.username || 'Аноним')}</span>
                    <span class="profile-status">${escapeHtml(p.status || '🏠 Дома')}</span>
                </div>
            `).join('');
        }

        async function loadTopStudents() {
            const { data: stats } = await supabase.from('study_stats').select('user_id, total_seconds').order('total_seconds', { ascending: false }).limit(10);
            if (!stats?.length) {
                document.getElementById('topStudents').innerHTML = '<div class="loading">Нет данных</div>';
                return;
            }
            const { data: profiles } = await supabase.from('profiles').select('id, username').in('id', stats.map(s => s.user_id));
            const userMap = new Map(profiles?.map(p => [p.id, p.username]) || []);
            
            let html = '';
            stats.forEach((stat, idx) => {
                const name = userMap.get(stat.user_id) || 'Студент';
                const hours = Math.floor(stat.total_seconds / 3600);
                const mins = Math.floor((stat.total_seconds % 3600) / 60);
                html += `<div class="top-student-item">
                    <span class="top-rank">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : `${idx+1}.`}</span>
                    <span class="top-name">${escapeHtml(name)}</span>
                    <span class="top-time">${hours}ч ${mins}мин</span>
                </div>`;
            });
            document.getElementById('topStudents').innerHTML = html;
        }

        async function loadUserAchievements() {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                document.getElementById('achievementsList').innerHTML = '<div class="loading">Войдите для просмотра</div>';
                return;
            }
            const { data: achievements } = await supabase.from('achievements').select('title, description, earned_at').eq('user_id', user.id).order('earned_at', { ascending: false });
            if (!achievements?.length) {
                document.getElementById('achievementsList').innerHTML = '<div class="loading">Нет достижений</div>';
                return;
            }
            let html = '';
            for (const a of achievements) {
                html += `<div class="achievement-item">
                    <div class="achievement-title">🏅 ${escapeHtml(a.title)}</div>
                    <div class="achievement-desc">${escapeHtml(a.description)}</div>
                </div>`;
            }
            document.getElementById('achievementsList').innerHTML = html;
        }

        // ========== ЧАТ ==========
        window.fetchChatMessages = async () => {
            const { data: messages, error } = await supabase.from('messages').select('id, username, text').order('created_at', { ascending: true }).limit(50);
            
            if (error) {
                console.error('Ошибка чата:', error);
                document.getElementById('chatMessages').innerHTML = '<div class="loading">⚠️ Ошибка загрузки чата. Проверьте таблицу messages в Supabase</div>';
                return;
            }
            
            const container = document.getElementById('chatMessages');
            if (!messages?.length) {
                container.innerHTML = '<div class="loading">💬 Сообщений пока нет</div>';
                return;
            }
            
            container.innerHTML = messages.map(m => `
                <div class="chat-message">
                    <span class="chat-author">${escapeHtml(m.username)}:</span>
                    <span class="chat-text">${escapeHtml(m.text)}</span>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        };

        window.sendChatMessage = async () => {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text) return;
            
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                alert('Войдите в аккаунт, чтобы отправлять сообщения!');
                return;
            }
            
            const username = user.user_metadata.full_name || user.email;
            
            const { error } = await supabase.from('messages').insert({ username, text });
            if (error) {
                console.error('Ошибка отправки:', error);
                alert('Ошибка: ' + error.message);
                return;
            }
            
            input.value = '';
            await window.fetchChatMessages();
            await updateAchievementsByMessageCount();
        };

        // ========== ПРОВЕРКА ПОЛЬЗОВАТЕЛЯ ==========
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            const statusDiv = document.getElementById('statusButtons');
            const sessionDiv = document.getElementById('sessionContainer');
            const myInfoDiv = document.getElementById('myInfo');
            
            if (user) {
                const userName = user.user_metadata.full_name || user.email;
                myInfoDiv.innerHTML = `
                    <div class="user-name-large">${escapeHtml(userName)}</div>
                    <div class="profile-item" style="justify-content: flex-start; gap: 10px;">
                        <span class="profile-status">📧 ${escapeHtml(user.email)}</span>
                    </div>
                `;
                statusDiv.classList.remove('disabled');
                sessionDiv.classList.remove('disabled');
                
                if (!timerInterval) window.startTimer();
                
                await fetchGroup();
                await window.fetchChatMessages();
                await loadTopStudents();
                await loadUserAchievements();
                await checkEarlyBird(user.id, user.created_at);
                await updateAchievementsByMessageCount();
                
                // Автосохранение времени
                setInterval(async () => {
                    if (timerInterval && !isPaused && sessionSeconds > lastSavedSeconds) {
                        const delta = sessionSeconds - lastSavedSeconds;
                        await saveStudySeconds(delta);
                        lastSavedSeconds = sessionSeconds;
                    }
                }, 30000);
            } else {
                myInfoDiv.innerHTML = `
                    <div class="auth-buttons">
                        <button class="auth-btn" onclick="window.openEmailModal('register')">📝 РЕГИСТРАЦИЯ</button>
                        <button class="auth-btn" onclick="window.openEmailModal('login')">🔐 ВХОД ПО EMAIL</button>
                        <button class="auth-btn" onclick="window.loginWithGoogle()" style="border-color:#4285F4;">🚀 ВОЙТИ ЧЕРЕЗ GOOGLE</button>
                    </div>
                `;
                statusDiv.classList.add('disabled');
                sessionDiv.classList.add('disabled');
                document.getElementById('chatMessages').innerHTML = '<div class="loading">🔒 Войдите, чтобы участвовать в чате</div>';
                window.stopTimer();
            }
        }

        function subscribeToChanges() {
            supabase.channel('profiles_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => fetchGroup()).subscribe();
            supabase.channel('messages_changes').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => window.fetchChatMessages()).subscribe();
            supabase.channel('stats_changes').on('postgres_changes', { event: '*', schema: 'public', table: 'study_stats' }, () => loadTopStudents()).subscribe();
        }

        async function init() {
            await checkUser();
            subscribeToChanges();
            setInterval(fetchGroup, 30000);
        }
        
        init();
        
        window.onclick = (e) => {
            if (e.target === document.getElementById('emailModal')) window.closeEmailModal();
        };
    </script>
</body>
</html>
