<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BaaS App</title>
    <style>
        /* Общие стили */
        body { font-family: 'Inter', sans-serif; background: #f4f7f6; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        /* Стили авторизации */
        .auth-bar { display: flex; align-items: center; gap: 15px; justify-content: center; }
        .user-avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #007bff; }
        #loginBtn { background: white; color: #444; border: 1px solid #ddd; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.3s; }
        #loginBtn:hover { background: #f1f1f1; }
        #logoutBtn { background: #ff4757; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; }

        /* Поля ввода */
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button#mainBtn { background: #007bff; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; font-weight: 600; cursor: pointer; margin-top: 10px; }
        
        /* Посты */
        .post { background: #fff; border: 1px solid #eaeaea; padding: 15px; margin-top: 15px; border-radius: 8px; width: 100%; max-width: 500px; }
        .time { font-size: 11px; color: #999; float: right; }
        .like-btn { cursor: pointer; border: none; background: #f8f9fa; padding: 5px 12px; border-radius: 20px; font-size: 14px; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="authSection" class="container">
        <div id="loggedOutUI" style="text-align: center;">
            <button id="loginBtn">🔵 Войти через Google</button>
        </div>
        
        <div id="userInfo" class="auth-bar" style="display: none;">
            <img id="userPhoto" class="user-avatar" src="" alt="Avatar">
            <div>
                <div id="userName" style="font-weight: bold;"></div>
                <button id="logoutBtn">Выйти</button>
            </div>
        </div>
    </div>

    <div id="messageForm" class="container" style="display: none;">
        <h3 style="margin-top: 0;">Новая запись</h3>
        <input type="text" id="name" placeholder="Имя" readonly style="background: #f9f9f9;">
        <input type="email" id="email" placeholder="Email" readonly style="background: #f9f9f9;">
        <input type="text" id="content" placeholder="Что нового?">
        <button id="mainBtn">Опубликовать в облако</button>
    </div>

    <div id="feed" style="width: 100%; max-width: 500px;"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDZcurSOkEfsL4gqdGAgVE9Kcxuw9YN2xs",
            authDomain: "yusuf-5c586.firebaseapp.com",
            projectId: "yusuf-5c586",
            storageBucket: "yusuf-5c586.firebasestorage.app",
            messagingSenderId: "772209549280",
            appId: "1:772209549280:web:003704162681f805e15585",
            measurementId: "G-QLK34HJGCE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');
        const loggedOutUI = document.getElementById('loggedOutUI');
        const userInfo = document.getElementById('userInfo');
        const messageForm = document.getElementById('messageForm');

        // Логика кнопок
        loginBtn.onclick = () => signInWithPopup(auth, provider).catch(err => console.error(err));
        logoutBtn.onclick = () => signOut(auth);

        // Слушатель состояния входа
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loggedOutUI.style.display = 'none';
                userInfo.style.display = 'flex';
                messageForm.style.display = 'block';
                document.getElementById('userName').innerText = user.displayName;
                document.getElementById('userPhoto').src = user.photoURL;
                document.getElementById('name').value = user.displayName;
                document.getElementById('email').value = user.email;
            } else {
                loggedOutUI.style.display = 'block';
                userInfo.style.display = 'none';
                messageForm.style.display = 'none';
            }
        });

        // Глобальные функции для кнопок в ленте
        window.react = async (id, type) => {
            await updateDoc(doc(db, "requests", id), { [`reactions.${type}`]: increment(1) });
        };
        window.deletePost = async (id) => {
            if (confirm("Удалить?")) await deleteDoc(doc(db, "requests", id));
        };

        // Публикация
        document.getElementById('mainBtn').onclick = async () => {
            const content = document.getElementById('content').value;
            if (!content) return alert("Напишите что-нибудь!");
            
            await addDoc(collection(db, "requests"), {
                name: auth.currentUser.displayName,
                email: auth.currentUser.email,
                text: content,
                reactions: { like: 0, fire: 0 },
                timestamp: serverTimestamp()
            });
            document.getElementById('content').value = "";
        };

        // Лента в реальном времени
        const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));
        onSnapshot(q, (snapshot) => {
            const feed = document.getElementById('feed');
            feed.innerHTML = "";
            snapshot.forEach((doc) => {
                const data = doc.data();
                const date = data.timestamp ? data.timestamp.toDate().toLocaleString() : '...';
                feed.innerHTML += `
                    <div class="post">
                        <span class="time">${date}</span>
                        <b>${data.name}</b>
                        <p style="margin: 10px 0;">${data.text}</p>
                        <div style="display:flex; gap:10px;">
                            <button class="like-btn" onclick="react('${doc.id}', 'like')">👍 ${data.reactions?.like || 0}</button>
                            <button class="like-btn" onclick="react('${doc.id}', 'fire')">🔥 ${data.reactions?.fire || 0}</button>
                            <button class="like-btn" onclick="deletePost('${doc.id}')" style="background:#fff1f1; color:red; margin-left:auto;">🗑</button>
                        </div>
                    </div>`;
            });
        });
    </script>
</body>
</html>
