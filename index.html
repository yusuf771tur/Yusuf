<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Учебная платформа</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 24px;
        }

        .full-width {
            grid-column: span 3;
        }

        .card {
            background: white;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 16px;
            color: #1e293b;
            text-align: center;
        }

        h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            color: #1e293b;
            border-left: 4px solid #667eea;
            padding-left: 12px;
        }

        .btn-google {
            background: #4285F4;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            background: #f8fafc;
            padding: 16px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            color: white;
        }

        .user-name {
            font-weight: 700;
            font-size: 1.2rem;
        }

        .user-email {
            font-size: 0.8rem;
            color: #64748b;
        }

        .logout-btn {
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            cursor: pointer;
            font-weight: 600;
        }

        .timer-card {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .timer-display {
            font-family: monospace;
            font-size: 2rem;
            font-weight: 700;
            color: #facc15;
        }

        .total-study {
            color: #94a3b8;
            margin: 12px 0;
            font-size: 0.9rem;
        }

        .session-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 8px 20px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start { background: #10b981; color: white; }
        .btn-pause { background: #f59e0b; color: #1e293b; }
        .btn-end { background: #ef4444; color: white; }
        .btn-primary { background: #667eea; color: white; }
        .btn-danger { background: #ef4444; color: white; }
        .btn-sm { padding: 4px 12px; font-size: 0.8rem; }

        .user-item, .note-item, .poll-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .user-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .online-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #22c55e;
        }

        .offline-dot {
            background: #94a3b8;
        }

        .leaderboard-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            border-bottom: 1px solid #e2e8f0;
        }

        .medal {
            font-size: 1.5rem;
            min-width: 40px;
        }

        .chat-messages {
            height: 250px;
            overflow-y: auto;
            background: #f8fafc;
            border-radius: 20px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .message {
            background: white;
            border-radius: 18px;
            padding: 10px 16px;
            margin-bottom: 12px;
        }

        .message strong {
            color: #2563eb;
        }

        .message-time {
            font-size: 0.7rem;
            color: #94a3b8;
            margin-left: 12px;
        }

        .chat-input {
            display: flex;
            gap: 12px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 0.9rem;
        }

        .send-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 40px;
            padding: 0 24px;
            cursor: pointer;
        }

        .achievements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-top: 16px;
        }

        .achievement-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
        }

        .achievement-card.unlocked {
            background: linear-gradient(135deg, #667eea15, #764ba215);
            border: 2px solid #667eea;
        }

        .achievement-card.locked {
            opacity: 0.4;
            filter: grayscale(100%);
        }

        .achievement-icon {
            font-size: 2rem;
            margin-bottom: 8px;
        }

        .achievement-title {
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .achievement-desc {
            font-size: 0.7rem;
            color: #64748b;
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            animation: slideIn 0.3s ease-out;
            z-index: 1000;
        }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .hidden {
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #667eea;
        }

        .stat-label {
            font-size: 0.7rem;
            color: #64748b;
            margin-top: 4px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 24px;
            padding: 24px;
            max-width: 500px;
            width: 90%;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 12px;
        }

        .vote-btn {
            background: #667eea;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 4px 12px;
            font-size: 0.7rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .poll-option {
            margin-bottom: 12px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e2e8f0;
            border-radius: 3px;
            margin-top: 4px;
        }

        .progress-fill {
            height: 100%;
            background: #667eea;
            border-radius: 3px;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card full-width" id="authCard">
        <h1>📚 Учебная платформа</h1>
        <div id="authContent"><div class="loading">⏳ Загрузка...</div></div>
    </div>

    <div class="card full-width hidden" id="appCard">
        <div class="profile-header">
            <div class="user-info">
                <div class="avatar" id="userAvatar">👤</div>
                <div>
                    <div class="user-name" id="userName"></div>
                    <div class="user-email" id="userEmail"></div>
                </div>
            </div>
            <button class="logout-btn" id="logoutBtn">Выйти</button>
        </div>

        <div class="timer-card">
            <div class="timer-display" id="timerDisplay">00:00:00</div>
            <div class="total-study" id="totalStudyDisplay">📚 Всего учёбы: 0 мин</div>
            <div class="session-buttons">
                <button class="btn btn-start" id="startBtn">▶ Начать</button>
                <button class="btn btn-pause" id="pauseBtn">⏸ Перерыв</button>
                <button class="btn btn-end" id="endBtn">⏹ Завершить</button>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-value" id="sessionCount">0</div><div class="stat-label">Сессий</div></div>
            <div class="stat-card"><div class="stat-value" id="messageCount">0</div><div class="stat-label">Сообщений</div></div>
            <div class="stat-card"><div class="stat-value" id="achievementCount">0</div><div class="stat-label">Достижений</div></div>
            <div class="stat-card"><div class="stat-value" id="rankPlace">#0</div><div class="stat-label">Место в рейтинге</div></div>
        </div>
    </div>

    <div class="card hidden" id="groupCard">
        <h2>👥 Монитор группы <span id="onlineCount">0</span> онлайн</h2>
        <div id="groupList"></div>
    </div>

    <div class="card hidden" id="leaderboardCard">
        <h2>🏆 Топ студентов</h2>
        <div id="leaderboardList"></div>
    </div>

    <div class="card hidden" id="notesCard">
        <h2>📝 Мои заметки</h2>
        <button class="btn btn-primary btn-sm" id="addNoteBtn">+ Новая заметка</button>
        <div id="notesList" style="margin-top: 12px;"></div>
    </div>

    <div class="card hidden" id="pollsCard">
        <h2>📊 Опросы группы</h2>
        <button class="btn btn-primary btn-sm" id="createPollBtn">+ Создать опрос</button>
        <div id="pollsList" style="margin-top: 12px;"></div>
    </div>

    <div class="card full-width hidden" id="achievementsCard">
        <h2>🎖 Мои достижения</h2>
        <div id="achievementsList" class="achievements-grid"></div>
    </div>

    <div class="card full-width hidden" id="chatCard">
        <h2>💬 Общий чат</h2>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input">
            <input type="text" id="chatInput" placeholder="Напишите сообщение...">
            <button class="send-btn" id="sendBtn">Отправить</button>
        </div>
    </div>
</div>

<div id="noteModal" class="modal">
    <div class="modal-content">
        <h3>✏️ Новая заметка</h3>
        <div class="form-group"><label>Заголовок</label><input type="text" id="noteTitle"></div>
        <div class="form-group"><label>Содержание</label><textarea id="noteContent" rows="4"></textarea></div>
        <button class="btn btn-primary btn-sm" id="saveNoteBtn">Сохранить</button>
        <button class="btn btn-danger btn-sm" id="closeNoteModal">Отмена</button>
    </div>
</div>

<div id="pollModal" class="modal">
    <div class="modal-content">
        <h3>📊 Создать опрос</h3>
        <div class="form-group"><label>Вопрос</label><input type="text" id="pollQuestion"></div>
        <div class="form-group"><label>Варианты (через запятую)</label><input type="text" id="pollOptions" placeholder="Вариант 1, Вариант 2, Вариант 3"></div>
        <button class="btn btn-primary btn-sm" id="savePollBtn">Создать</button>
        <button class="btn btn-danger btn-sm" id="closePollModal">Отмена</button>
    </div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
    
    const SUPABASE_URL = 'https://qbykreduhwmlriyuhnxs.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFieWtyZWR1aHdtbHJpeXVobnhzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY2ODQ1MzcsImV4cCI6MjA5MjI2MDUzN30.hT3f3TIZfiZ044tmaS899sUS-2O9MspbAFvldG8e-hQ';
    
    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = null;
    let sessionStartTime = null;
    let totalSeconds = 0;
    let timerInterval = null;
    let currentSessionCount = 0;
    
    const ACHIEVEMENTS = {
        early_bird: { id: 'early_bird', title: '🌅 Ранняя пташка', desc: 'Зашел на платформу до 8:00', icon: '🌅' },
        marathon: { id: 'marathon', title: '🏃 Марафонец', desc: 'Проучился более 2 часов за раз', icon: '🏃' },
        activist: { id: 'activist', title: '💬 Активист', desc: 'Написал 20 сообщений', icon: '💬' },
        first_step: { id: 'first_step', title: '🎯 Первый шаг', desc: 'Прошел первую сессию', icon: '🎯' },
        note_master: { id: 'note_master', title: '📝 Мастер заметок', desc: 'Создал 5 заметок', icon: '📝' },
        poll_creator: { id: 'poll_creator', title: '🎯 Организатор', desc: 'Создал 3 опроса', icon: '🎯' }
    };
    
    function showNotification(msg, title = 'Уведомление') {
        const notif = document.createElement('div');
        notif.className = 'notification';
        notif.innerHTML = `<strong>${title}</strong><br>${msg}`;
        document.body.appendChild(notif);
        setTimeout(() => notif.remove(), 3000);
    }
    
    async function unlockAchievement(achievementId) {
        if (!currentUser) return false;
        
        const { data: profile } = await supabase
            .from('profiles')
            .select('achievements')
            .eq('id', currentUser.id)
            .single();
        
        let achievements = profile?.achievements || [];
        if (achievements.includes(achievementId)) return false;
        
        achievements.push(achievementId);
        
        const { error } = await supabase
            .from('profiles')
            .update({ achievements: achievements })
            .eq('id', currentUser.id);
        
        if (!error) {
            const ach = ACHIEVEMENTS[achievementId];
            showNotification(`${ach.title}: ${ach.desc}`, '🎉 НОВОЕ ДОСТИЖЕНИЕ!');
            await loadAchievements();
            await updateStats();
            return true;
        }
        return false;
    }
    
    function formatTime(sec) {
        return `${Math.floor(sec/3600).toString().padStart(2,'0')}:${Math.floor((sec%3600)/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`;
    }
    
    function formatTotal(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        return h > 0 ? `${h}ч ${m}мин` : `${m} мин`;
    }
    
    async function loadAchievements() {
        const { data: profile } = await supabase
            .from('profiles')
            .select('achievements')
            .eq('id', currentUser.id)
            .single();
        
        const userAchievements = profile?.achievements || [];
        const container = document.getElementById('achievementsList');
        
        container.innerHTML = Object.values(ACHIEVEMENTS).map(ach => `
            <div class="achievement-card ${userAchievements.includes(ach.id) ? 'unlocked' : 'locked'}">
                <div class="achievement-icon">${ach.icon}</div>
                <div class="achievement-title">${ach.title}</div>
                <div class="achievement-desc">${ach.desc}</div>
            </div>
        `).join('');
        
        document.getElementById('achievementCount').textContent = `${userAchievements.length}/${Object.keys(ACHIEVEMENTS).length}`;
    }
    
    async function loadNotes() {
        const { data: notes } = await supabase
            .from('notes')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });
        
        const container = document.getElementById('notesList');
        
        if (!notes || notes.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">📭 Нет заметок</div>';
            return;
        }
        
        if (notes.length >= 5) await unlockAchievement('note_master');
        
        container.innerHTML = notes.map(note => `
            <div class="note-item" style="background: ${note.color || '#f8fafc'}; border-radius: 12px; margin-bottom: 8px; flex-direction: column; align-items: flex-start;">
                <div style="display: flex; justify-content: space-between; width: 100%;">
                    <strong>${escapeHtml(note.title)}</strong>
                    <button onclick="window.deleteNote('${note.id}')" style="background:#ef4444; color:white; border:none; border-radius:20px; padding:4px 12px; cursor:pointer;">🗑</button>
                </div>
                <div style="margin-top: 8px; font-size:0.85rem;">${escapeHtml(note.content)}</div>
                <div style="font-size:0.65rem; color:#64748b; margin-top:8px;">📅 ${new Date(note.created_at).toLocaleString()}</div>
            </div>
        `).join('');
    }
    
    window.deleteNote = async (id) => {
        if (confirm('Удалить заметку?')) {
            await supabase.from('notes').delete().eq('id', id);
            await loadNotes();
            showNotification('Заметка удалена');
        }
    };
    
    async function loadPolls() {
        const { data: polls } = await supabase
            .from('polls')
            .select('*, poll_votes(*)')
            .order('created_at', { ascending: false });
        
        const container = document.getElementById('pollsList');
        
        if (!polls || polls.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#94a3b8; padding:20px;">📊 Нет опросов</div>';
            return;
        }
        
        const userPolls = polls.filter(p => p.created_by === currentUser.id);
        if (userPolls.length >= 3) await unlockAchievement('poll_creator');
        
        for (const poll of polls) {
            const { data: author } = await supabase.from('profiles').select('username').eq('id', poll.created_by).single();
            const votes = poll.poll_votes || [];
            const totalVotes = votes.length;
            const userVote = votes.find(v => v.user_id === currentUser.id);
            const options = poll.options || [];
            
            const pollHtml = document.createElement('div');
            pollHtml.className = 'poll-item';
            pollHtml.style.cssText = 'flex-direction: column; align-items: flex-start; margin-bottom: 16px; background:#f8fafc; border-radius:12px;';
            
            pollHtml.innerHTML = `
                <div style="display: flex; justify-content: space-between; width: 100%;">
                    <strong>📊 ${escapeHtml(poll.question)}</strong>
                    <span style="font-size:0.7rem; color:#64748b;">Автор: ${escapeHtml(author?.username || 'Студент')}</span>
                </div>
                <div id="poll-${poll.id}" style="margin-top: 12px; width: 100%;"></div>
                <div class="poll-stats" style="margin-top: 8px;">📊 Всего голосов: ${totalVotes}</div>
            `;
            
            container.appendChild(pollHtml);
            
            const optionsContainer = pollHtml.querySelector(`#poll-${poll.id}`);
            
            for (let idx = 0; idx < options.length; idx++) {
                const opt = options[idx];
                const count = votes.filter(v => v.option_index === idx).length;
                const percent = totalVotes > 0 ? (count / totalVotes * 100).toFixed(1) : 0;
                
                const optionDiv = document.createElement('div');
                optionDiv.className = 'poll-option';
                optionDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between;">
                        <span>${escapeHtml(opt)}</span>
                        <span>${count} (${percent}%)</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${percent}%;"></div>
                    </div>
                    ${!userVote && currentUser.id !== poll.created_by ? `<button class="vote-btn" onclick="window.votePoll('${poll.id}', ${idx})">👍 Голосовать</button>` : ''}
                `;
                optionsContainer.appendChild(optionDiv);
            }
        }
    }
    
    window.votePoll = async (pollId, optionIndex) => {
        const { data: existing } = await supabase
            .from('poll_votes')
            .select('id')
            .eq('poll_id', pollId)
            .eq('user_id', currentUser.id)
            .single();
        
        if (existing) {
            showNotification('Вы уже голосовали!', '⚠️');
            return;
        }
        
        const { error } = await supabase.from('poll_votes').insert({
            poll_id: pollId,
            user_id: currentUser.id,
            option_index: optionIndex
        });
        
        if (!error) {
            showNotification('Голос учтен!', '✅');
            document.getElementById('pollsList').innerHTML = '';
            await loadPolls();
        }
    };
    
    async function loadLeaderboard() {
        const { data: topStudents } = await supabase
            .from('profiles')
            .select('username, total_study_seconds')
            .order('total_study_seconds', { ascending: false })
            .limit(10);
        
        const container = document.getElementById('leaderboardList');
        
        if (topStudents) {
            const { data: allUsers } = await supabase.from('profiles').select('id, total_study_seconds').order('total_study_seconds', { ascending: false });
            if (allUsers) {
                const rank = allUsers.findIndex(u => u.id === currentUser.id) + 1;
                document.getElementById('rankPlace').textContent = `#${rank}`;
            }
            
            container.innerHTML = topStudents.map((s, i) => {
                const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : '👤';
                return `
                    <div class="leaderboard-item">
                        <div class="user-left">
                            <span class="medal">${medal}</span>
                            <strong>${escapeHtml(s.username || 'Студент')}</strong>
                        </div>
                        <div>${formatTotal(s.total_study_seconds || 0)}</div>
                    </div>
                `;
            }).join('');
        }
    }
    
    async function loadMessages() {
        const { data: messages } = await supabase
            .from('messages')
            .select('*')
            .order('created_at', { ascending: true })
            .limit(100);
        
        const container = document.getElementById('chatMessages');
        if (!messages || messages.length === 0) {
            container.innerHTML = '<div style="text-align:center; color:#94a3b8;">💬 Нет сообщений</div>';
            return;
        }
        
        container.innerHTML = messages.map(m => `
            <div class="message">
                <strong>${escapeHtml(m.username)}</strong>
                <span class="message-time">${new Date(m.created_at).toLocaleTimeString()}</span>
                <div>${escapeHtml(m.message)}</div>
            </div>
        `).join('');
        container.scrollTop = container.scrollHeight;
    }
    
    async function loadGroupList() {
        const { data: users } = await supabase.from('profiles').select('username, status, last_seen');
        const now = new Date();
        const online = users?.filter(u => u.last_seen && new Date(u.last_seen) > new Date(now - 120000)).length || 0;
        document.getElementById('onlineCount').textContent = online;
        
        const container = document.getElementById('groupList');
        container.innerHTML = users?.map(u => `
            <div class="user-item">
                <div class="user-left">
                    <span class="online-dot"></span>
                    <strong>${escapeHtml(u.username || 'Аноним')}</strong>
                </div>
                <div>${u.status || '🏠 Дома'}</div>
            </div>
        `).join('') || '<div style="padding:20px;">Нет пользователей</div>';
    }
    
    async function updateStats() {
        const { data: profile } = await supabase
            .from('profiles')
            .select('message_count, achievements')
            .eq('id', currentUser.id)
            .single();
        
        if (profile) {
            document.getElementById('messageCount').textContent = profile.message_count || 0;
        }
    }
    
    async function startSession() {
        if (!currentUser || sessionStartTime) return;
        
        sessionStartTime = new Date();
        await supabase.from('profiles').update({
            study_session_start: sessionStartTime.toISOString(),
            status: '📚 Учусь'
        }).eq('id', currentUser.id);
        
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            if (sessionStartTime) {
                const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
                document.getElementById('timerDisplay').textContent = formatTime(elapsed);
            }
        }, 1000);
        
        await loadGroupList();
    }
    
    async function pauseSession() {
        if (!currentUser || !sessionStartTime) return;
        
        const elapsed = Math.floor((Date.now() - sessionStartTime) / 1000);
        if (elapsed > 0) {
            totalSeconds += elapsed;
            currentSessionCount++;
            document.getElementById('sessionCount').textContent = currentSessionCount;
            document.getElementById('totalStudyDisplay').textContent = `📚 Всего учёбы: ${formatTotal(totalSeconds)}`;
            
            if (currentSessionCount === 1) await unlockAchievement('first_step');
            if (elapsed >= 7200) await unlockAchievement('marathon');
        }
        
        sessionStartTime = null;
        await supabase.from('profiles').update({
            total_study_seconds: totalSeconds,
            study_session_start: null,
            status: '☕ Перерыв'
        }).eq('id', currentUser.id);
        
        document.getElementById('timerDisplay').textContent = '00:00:00';
        await loadGroupList();
        await loadLeaderboard();
    }
    
    async function init() {
        const { data: { user } } = await supabase.auth.getUser();
        
        if (user) {
            currentUser = user;
            
            let { data: profile } = await supabase
                .from('profiles')
                .select('*')
                .eq('id', user.id)
                .single();
            
            if (!profile) {
                await supabase.from('profiles').insert({
                    id: user.id,
                    username: user.user_metadata?.full_name || user.email.split('@')[0],
                    status: '🏠 Дома',
                    total_study_seconds: 0,
                    message_count: 0,
                    achievements: []
                });
                profile = { total_study_seconds: 0 };
            }
            
            totalSeconds = profile.total_study_seconds || 0;
            document.getElementById('totalStudyDisplay').textContent = `📚 Всего учёбы: ${formatTotal(totalSeconds)}`;
            document.getElementById('userName').textContent = user.user_metadata?.full_name || user.email.split('@')[0];
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userAvatar').textContent = (user.user_metadata?.full_name?.charAt(0) || user.email.charAt(0)).toUpperCase();
            
            const hour = new Date().getHours();
            if (hour < 8) await unlockAchievement('early_bird');
            
            await loadAchievements();
            await loadNotes();
            await loadPolls();
            await loadLeaderboard();
            await loadMessages();
            await loadGroupList();
            await updateStats();
            
            document.getElementById('authCard').classList.add('hidden');
            document.getElementById('appCard').classList.remove('hidden');
            document.getElementById('groupCard').classList.remove('hidden');
            document.getElementById('leaderboardCard').classList.remove('hidden');
            document.getElementById('notesCard').classList.remove('hidden');
            document.getElementById('pollsCard').classList.remove('hidden');
            document.getElementById('achievementsCard').classList.remove('hidden');
            document.getElementById('chatCard').classList.remove('hidden');
            
            setInterval(() => {
                loadGroupList();
                loadLeaderboard();
            }, 10000);
            
            supabase.channel('public')
                .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, () => loadMessages())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'notes' }, () => loadNotes())
                .on('postgres_changes', { event: '*', schema: 'public', table: 'polls' }, () => {
                    document.getElementById('pollsList').innerHTML = '';
                    loadPolls();
                })
                .subscribe();
        } else {
            document.getElementById('authContent').innerHTML = `
                <button class="btn-google" id="googleLoginBtn">🚀 Войти через Google</button>
                <p style="margin-top:20px; text-align:center; color:#64748b;">Войдите, чтобы использовать платформу</p>
            `;
            document.getElementById('googleLoginBtn')?.addEventListener('click', async () => {
                await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } });
            });
        }
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[m]));
    }
    
    // Event listeners
    document.getElementById('startBtn')?.addEventListener('click', startSession);
    document.getElementById('pauseBtn')?.addEventListener('click', pauseSession);
    document.getElementById('endBtn')?.addEventListener('click', pauseSession);
    document.getElementById('logoutBtn')?.addEventListener('click', async () => { await supabase.auth.signOut(); location.reload(); });
    document.getElementById('sendBtn')?.addEventListener('click', async () => {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (text && currentUser) {
            await supabase.from('messages').insert({
                user_id: currentUser.id,
                username: document.getElementById('userName').textContent,
                message: text
            });
            
            const { data: profile } = await supabase.from('profiles').select('message_count').eq('id', currentUser.id).single();
            const newCount = (profile?.message_count || 0) + 1;
            await supabase.from('profiles').update({ message_count: newCount }).eq('id', currentUser.id);
            
            if (newCount >= 20) await unlockAchievement('activist');
            
            input.value = '';
            await loadMessages();
            await updateStats();
        }
    });
    
    document.getElementById('addNoteBtn')?.addEventListener('click', () => {
        document.getElementById('noteModal').style.display = 'flex';
    });
    
    document.getElementById('saveNoteBtn')?.addEventListener('click', async () => {
        const title = document.getElementById('noteTitle').value;
        const content = document.getElementById('noteContent').value;
        if (title && content) {
            await supabase.from('notes').insert({
                user_id: currentUser.id,
                title: title,
                content: content,
                color: 'white'
            });
            document.getElementById('noteModal').style.display = 'none';
            document.getElementById('noteTitle').value = '';
            document.getElementById('noteContent').value = '';
            await loadNotes();
            showNotification('Заметка создана!', '✅');
        } else {
            alert('Заполните заголовок и содержание');
        }
    });
    
    document.getElementById('createPollBtn')?.addEventListener('click', () => {
        document.getElementById('pollModal').style.display = 'flex';
    });
    
    document.getElementById('savePollBtn')?.addEventListener('click', async () => {
        const question = document.getElementById('pollQuestion').value;
        const optionsStr = document.getElementById('pollOptions').value;
        if (question && optionsStr) {
            const options = optionsStr.split(',').map(o => o.trim()).filter(o => o);
            if (options.length >= 2) {
                await supabase.from('polls').insert({
                    question: question,
                    options: options,
                    created_by: currentUser.id
                });
                document.getElementById('pollModal').style.display = 'none';
                document.getElementById('pollQuestion').value = '';
                document.getElementById('pollOptions').value = '';
                document.getElementById('pollsList').innerHTML = '';
                await loadPolls();
                showNotification('Опрос создан!', '✅');
            } else {
                alert('Введите минимум 2 варианта');
            }
        } else {
            alert('Заполните все поля');
        }
    });
    
    document.getElementById('closeNoteModal')?.addEventListener('click', () => {
        document.getElementById('noteModal').style.display = 'none';
    });
    
    document.getElementById('closePollModal')?.addEventListener('click', () => {
        document.getElementById('pollModal').style.display = 'none';
    });
    
    window.onclick = (event) => {
        if (event.target.classList.contains('modal')) {
            event.target.style.display = 'none';
        }
    };
    
    init();
</script>
</body>
</html>
