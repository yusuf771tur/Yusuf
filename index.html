<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud App — Панель управления</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; padding: 20px; margin: 0; }
        .container { width: 100%; max-width: 500px; background: white; padding: 25px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); margin-bottom: 20px; box-sizing: border-box; }
        .auth-card { text-align: center; }
        #loginBtn { background: white; color: #444; border: 1px solid #dadce0; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; }
        .user-info { display: none; align-items: center; justify-content: space-between; width: 100%; }
        .user-profile { display: flex; align-items: center; gap: 12px; }
        .user-avatar { width: 44px; height: 44px; border-radius: 50%; border: 2px solid #007bff; }
        #logoutBtn { background: #fee2e2; color: #dc2626; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; }
        #mainBtn { background: #007bff; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-weight: 600; cursor: pointer; }
        .post { background: white; border: 1px solid #f0f0f0; padding: 20px; margin-top: 15px; border-radius: 12px; position: relative; }
        .post img { width: 100%; border-radius: 8px; margin-top: 10px; max-height: 400px; object-fit: cover; }
        .time { font-size: 12px; color: #9ca3af; position: absolute; top: 20px; right: 20px; }
        .actions { display: flex; gap: 8px; margin-top: 15px; }
        .like-btn { cursor: pointer; padding: 6px 14px; border-radius: 20px; border: 1px solid #eee; }
        .del-btn { margin-left: auto; background: none; border: none; color: red; cursor: pointer; }
    </style>
</head>
<body>

<div class="container auth-card">
    <div id="loggedOutUI">
        <button id="loginBtn">Войти через Google</button>
    </div>
    
    <div id="userInfo" class="user-info">
        <div class="user-profile">
            <img id="userPhoto" class="user-avatar">
            <span id="userName"></span>
        </div>
        <button id="logoutBtn">Выйти</button>
    </div>
</div>

<div id="messageForm" class="container" style="display:none;">
    <h3>Создать пост</h3>
    <input type="text" id="name" readonly>
    <input type="text" id="content" placeholder="Текст...">
    <input type="text" id="imageUrlInput" placeholder="Ссылка на картинку (https://...)">
    <button id="mainBtn">Опубликовать</button>
</div>

<div id="feed" style="max-width:500px;width:100%;"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, updateDoc, doc, increment, deleteDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyDZcurSOkEfsL4gqdGAgVE9Kcxuw9YN2xs",
    authDomain: "yusuf-5c586.firebaseapp.com",
    projectId: "yusuf-5c586",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

loginBtn.onclick = () => signInWithPopup(auth, provider);
logoutBtn.onclick = () => signOut(auth);

onAuthStateChanged(auth, (user) => {
    loggedOutUI.style.display = user ? 'none' : 'block';
    userInfo.style.display = user ? 'flex' : 'none';
    messageForm.style.display = user ? 'block' : 'none';

    if (user) {
        userName.innerText = user.displayName;
        userPhoto.src = user.photoURL;
        name.value = user.displayName;
    }
});

window.react = async (id, type) => {
    await updateDoc(doc(db, "requests", id), {
        [`reactions.${type}`]: increment(1)
    });
};

window.deletePost = async (id) => {
    if (confirm("Удалить?")) {
        await deleteDoc(doc(db, "requests", id));
    }
};

mainBtn.onclick = async () => {
    const content = document.getElementById('content').value;
    const imageUrl = document.getElementById('imageUrlInput').value;

    if (!content && !imageUrl) return alert("Добавь текст или ссылку!");

    await addDoc(collection(db, "requests"), {
        name: auth.currentUser.displayName,
        text: content,
        imageUrl: imageUrl || null,
        reactions: { like: 0, fire: 0, laugh: 0 },
        timestamp: serverTimestamp()
    });

    content.value = "";
    imageUrlInput.value = "";
};

const q = query(collection(db, "requests"), orderBy("timestamp", "desc"));

onSnapshot(q, (snapshot) => {
    feed.innerHTML = "";

    snapshot.forEach((docItem) => {
        const data = docItem.data();
        const img = data.imageUrl ? `<img src="${data.imageUrl}">` : "";

        feed.innerHTML += `
            <div class="post">
                <span class="time">${data.timestamp ? data.timestamp.toDate().toLocaleString() : ''}</span>
                <b>${data.name}</b>
                <p>${data.text || ''}</p>
                ${img}
                <div class="actions">
                    <button onclick="react('${docItem.id}','like')">👍 ${data.reactions?.like || 0}</button>
                    <button onclick="react('${docItem.id}','fire')">🔥 ${data.reactions?.fire || 0}</button>
                    <button onclick="react('${docItem.id}','laugh')">😂 ${data.reactions?.laugh || 0}</button>
                    <button class="del-btn" onclick="deletePost('${docItem.id}')">Удалить</button>
                </div>
            </div>
        `;
    });
});
</script>

</body>
</html>
